<!DOCTYPE html>
<html lang="es-DO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<title>Inventario desde el piso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="fondo-patron" aria-hidden="true"></div>

<header class="barra">
  <div class="barra-in">
    <button class="marca" id="btnInicio" type="button">
      <span class="marca-caja" aria-hidden="true"></span>
      <span class="marca-txt">Inventario desde el piso</span>
    </button>
    <span class="dato dato-racha" id="datoRacha"></span>
    <span class="dato dato-puntos" id="datoPuntos"></span>
    <nav class="tabs" aria-label="Secciones">
      <button class="tab" id="tabCurso" type="button">Curso</button>
      <button class="tab" id="tabRepaso" type="button">Rehacer</button>
      <button class="tab" id="tabMenu" type="button">Menú</button>
    </nav>
  </div>
</header>

<main id="app" class="app" tabindex="-1"></main>

<div id="menu" class="velo" hidden>
  <div class="menu-caja" role="dialog" aria-modal="true" aria-label="Menú"></div>
</div>

<div id="aviso" class="aviso" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
